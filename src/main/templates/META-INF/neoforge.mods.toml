modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/reiko45/Reikos-Galacticraft/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/reiko45/Reikos-Galacticraft"
authors = "${mod_authors}"
credits = "Based on Galacticraft Legacy by Team Galacticraft (MIT). Original Galacticraft by micdoodle8, radfast and contributors. This port is not affiliated with or endorsed by Team Galacticraft."
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
