modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/reiko45/Reikos-Galacticraft/issues"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/reiko45/Reikos-Galacticraft"
authors = "${mod_authors}"
credits = "Based on Galacticraft Legacy by Team Galacticraft (MIT). Original Galacticraft by micdoodle8, radfast and contributors. This port is not affiliated with or endorsed by Team Galacticraft."
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[1.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[15,)"
ordering = "NONE"
side = "BOTH"

# BuildCraft Reborn: MJ power both ways, wrenches both ways, Galacticraft fuel in its combustion engine, its pipes in
# sealable blocks. Loaded after it so that Galacticraft's fuel values in its fuels data map win over its own c:fuel entry.
[[dependencies.${mod_id}]]
modId = "buildcraftreborn"
type = "optional"
versionRange = "[2.1,)"
ordering = "AFTER"
side = "BOTH"
