plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // JEI (optional recipe viewer integration)
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    // EMI (optional recipe viewer integration)
    maven {
        url = 'https://maven.terraformersmc.com/releases'
        content {
            includeGroup 'dev.emi'
        }
    }
    // Jade (optional block tooltips)
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = 'reikos-galacticraft'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Dev aid: creates a flat test world, opens every machine GUI, saves screenshots and quits (client/ScreenshotTour).
        screenshotTour {
            client()
            systemProperty 'galacticraftcore.screenshotTour', 'true'
            // -PtourLastOnly=true: only the newest group of steps (quicker while working on it)
            systemProperty 'galacticraftcore.screenshotTour.lastOnly', project.findProperty('tourLastOnly') ?: 'false'
            programArguments.addAll '--width', '1280', '--height', '720'
        }

        // Runs every registered GameTest and exits; used in CI. It gets its own directory, and a fresh world each run (see
        // below): Launch Controllers keep their chunks loaded, so a reused world would bring back earlier runs' machines.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // ./gradlew runData regenerates src/generated/resources (models, loot, recipes, tags, lang...).
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete file('run/gametest/world')
    }
}

// Datagen output is committed and shipped like hand-written resources.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI is optional: compile against its API only, and run it in the dev client.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // EMI and Jade are optional too. Run them in dev with -PwithEmi / -PwithJade (EMI and JEI side by side work, but
    // crowd the screen, so the screenshot tour leaves them out).
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly "maven.modrinth:jade:${jade_version}"
    if (project.hasProperty('withEmi')) {
        localRuntime "dev.emi:emi-neoforge:${emi_version}"
    }
    if (project.hasProperty('withJade')) {
        localRuntime "maven.modrinth:jade:${jade_version}"
    }
}

// Expands ${...} placeholders in src/main/templates (neoforge.mods.toml) from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('jar', Jar) {
    // MIT requires the copyright notices to travel with the binary.
    from('LICENSE') { rename { 'LICENSE_reikos-galacticraft' } }
    from('LICENSE-GALACTICRAFT-LEGACY') { rename { 'LICENSE_galacticraft-legacy' } }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
