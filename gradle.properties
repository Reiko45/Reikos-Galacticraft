# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Parchment (official mappings + parameter names / javadoc)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Optional integrations
jei_version=19.70.0.460
emi_version=1.1.24+1.21.1
jade_version=15.10.6+neoforge

# Mod
# The 1.12.2 mod id is kept so asset paths and translation keys can be ported 1:1.
mod_id=galacticraftcore
mod_name=Galacticraft (Reiko's 1.21.1 port)
mod_license=MIT
mod_version=0.1.0-alpha
mod_group_id=io.github.reiko45.galacticraft
mod_authors=Team Galacticraft (original), micdoodle8, radfast, Reiko (NeoForge 1.21.1 port)
mod_description=An unofficial NeoForge 1.21.1 port of Galacticraft Legacy (1.12.2) by Team Galacticraft. Work in progress.
